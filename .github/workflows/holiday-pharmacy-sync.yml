name: 휴일지킴이약국 자동 수집 및 발행

on:
  schedule:
    - cron: '30 20 * * *'  # 매일 오전 5시 30분 KST (UTC 20:30)
  workflow_dispatch:        # 수동 실행 가능
    inputs:
      force_full_sync:
        description: '전체 재수집 강제 실행 (평소엔 월요일에만 자동 실행됨)'
        type: boolean
        default: false
      force_publish_date:
        description: '발행 판단용 날짜 강제 지정 — 테스트용 (YYYY-MM-DD, 비워두면 평소처럼 내일 날짜 자동 사용)'
        type: string
        default: ''

jobs:
  sync-holiday-pharmacy:
    runs-on: ubuntu-latest

    steps:
      - name: 약국 데이터 수집 → 자동 발행 판단 → 글 발행
        env:
          HOLIDAY_PHARMACY_API_KEY: ${{ secrets.HOLIDAY_PHARMACY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_SECRET_TOKEN: ${{ secrets.ADMIN_SECRET_TOKEN }}
          FORCE_FULL_SYNC: ${{ github.event.inputs.force_full_sync }}
          FORCE_PUBLISH_DATE: ${{ github.event.inputs.force_publish_date }}
        run: |
          node << 'SCRIPT'
          const {
            HOLIDAY_PHARMACY_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ADMIN_SECRET_TOKEN,
            FORCE_FULL_SYNC, FORCE_PUBLISH_DATE,
          } = process.env

          const SITE_BASE = 'https://www.fsfood.kr'

          const SIDO_LIST = [
            '서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시',
            '세종특별자치시','경기도','강원특별자치도','충청북도','충청남도','전북특별자치도','전라남도',
            '경상북도','경상남도','제주특별자치도',
          ]
          const NUM_OF_ROWS = 500

          // 2026년 신정~성탄절 중 명절(설날/추석) 제외 단일 공휴일 + 대체공휴일. 매년 1월 갱신 필요.
          const SINGLE_DAY_HOLIDAYS_2026 = [
            '2026-01-01', '2026-03-01', '2026-03-02', '2026-05-05', '2026-05-24', '2026-05-25',
            '2026-06-06', '2026-08-15', '2026-08-17', '2026-10-03', '2026-10-05', '2026-10-09', '2026-12-25',
          ]

          function fmtTime(v) {
            if (v === undefined || v === null || v === '') return null
            return String(v).padStart(4, '0')
          }

          // ============ 1) 일반 공휴일 약국 (dutyTime8) ============
          const PHARM_API_BASE = 'https://apis.data.go.kr/B552657/ErmctInsttInfoInqireService/getParmacyListInfoInqire'

          function mapPharmItem(sido, item) {
            const hpid = item.hpid || `${sido}|${item.dutyName}|${item.dutyAddr}`
            return {
              hpid, name: item.dutyName || '', sido, addr: item.dutyAddr || '', tel: item.dutyTel1 || '',
              lat: item.wgs84Lat ? Number(item.wgs84Lat) : null,
              lng: item.wgs84Lon ? Number(item.wgs84Lon) : null,
              duty_time1_s: fmtTime(item.dutyTime1s), duty_time1_c: fmtTime(item.dutyTime1c),
              duty_time2_s: fmtTime(item.dutyTime2s), duty_time2_c: fmtTime(item.dutyTime2c),
              duty_time3_s: fmtTime(item.dutyTime3s), duty_time3_c: fmtTime(item.dutyTime3c),
              duty_time4_s: fmtTime(item.dutyTime4s), duty_time4_c: fmtTime(item.dutyTime4c),
              duty_time5_s: fmtTime(item.dutyTime5s), duty_time5_c: fmtTime(item.dutyTime5c),
              duty_time6_s: fmtTime(item.dutyTime6s), duty_time6_c: fmtTime(item.dutyTime6c),
              duty_time7_s: fmtTime(item.dutyTime7s), duty_time7_c: fmtTime(item.dutyTime7c),
              duty_time8_s: fmtTime(item.dutyTime8s), duty_time8_c: fmtTime(item.dutyTime8c),
              fetched_at: new Date().toISOString(),
            }
          }

          async function fetchSido(sido) {
            let pageNo = 1, totalCount = Infinity
            const rows = []
            while ((pageNo - 1) * NUM_OF_ROWS < totalCount) {
              const url = `${PHARM_API_BASE}?serviceKey=${HOLIDAY_PHARMACY_API_KEY}&Q0=${encodeURIComponent(sido)}&pageNo=${pageNo}&numOfRows=${NUM_OF_ROWS}&_type=json`
              const res = await fetch(url)
              const text = await res.text()
              let json
              try { json = JSON.parse(text) } catch { console.log(`❌ [약국/${sido}] JSON 파싱 실패: ${text.slice(0, 300)}`); return rows }
              const header = json?.response?.header
              if (!header || header.resultCode !== '00') { console.log(`❌ [약국/${sido}] API 오류: ${JSON.stringify(header)}`); return rows }
              const body = json.response.body
              totalCount = Number(body.totalCount || 0)
              let items = body.items?.item || []
              if (!Array.isArray(items)) items = items ? [items] : []
              for (const item of items) if (item.dutyTime7s || item.dutyTime7c || item.dutyTime8s || item.dutyTime8c) rows.push(mapPharmItem(sido, item))
              if (items.length === 0) break
              pageNo++
              await new Promise(r => setTimeout(r, 150))
            }
            return rows
          }

          async function upsertPharmRows(rows) {
            if (rows.length === 0) return
            for (let i = 0; i < rows.length; i += 200) {
              const chunk = rows.slice(i, i + 200)
              const res = await fetch(`${SUPABASE_URL}/rest/v1/holiday_pharmacies?on_conflict=hpid`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${SUPABASE_SERVICE_ROLE_KEY}`, Prefer: 'resolution=merge-duplicates,return=minimal' },
                body: JSON.stringify(chunk),
              })
              if (!res.ok) console.log(`❌ [약국] upsert 실패 (${res.status}): ${await res.text()}`)
            }
          }

          // ============ 2) 명절(설날/추석) 비상진료 약국 ============
          const HOLIDAY_API_BASE = 'https://apis.data.go.kr/B552657/HolidyEmgncClnicInsttInfoInqireService/getHolidyClnicPosblEgytInfoInqire'

          function mapHolidayItem(sido, item) {
            const hpid = item.hpid || `${sido}|${item.dutyName}|${item.dutyAddr}`
            return {
              hpid, name: item.dutyName || '', sido, addr: item.dutyAddr || '', tel: item.dutyTel1 || '',
              duty_day1: item.dutyDay1 || null, duty_time1: item.dutyDaytime1 || null,
              duty_day2: item.dutyDay2 || null, duty_time2: item.dutyDaytime2 || null,
              duty_day3: item.dutyDay3 || null, duty_time3: item.dutyDaytime3 || null,
              duty_day4: item.dutyDay4 || null, duty_time4: item.dutyDaytime4 || null,
              duty_day5: item.dutyDay5 || null, duty_time5: item.dutyDaytime5 || null,
              duty_etc: item.dutyDayetc || null,
              fetched_at: new Date().toISOString(),
            }
          }

          async function fetchHolidaySido(sido) {
            let pageNo = 1, totalCount = Infinity
            const rows = []
            while ((pageNo - 1) * NUM_OF_ROWS < totalCount) {
              const url = `${HOLIDAY_API_BASE}?serviceKey=${HOLIDAY_PHARMACY_API_KEY}&Q0=${encodeURIComponent(sido)}&pageNo=${pageNo}&numOfRows=${NUM_OF_ROWS}&_type=json`
              const res = await fetch(url)
              const text = await res.text()
              let json
              try { json = JSON.parse(text) } catch { console.log(`❌ [명절/${sido}] JSON 파싱 실패: ${text.slice(0, 300)}`); return rows }
              const header = json?.response?.header
              if (!header || header.resultCode !== '00') { console.log(`❌ [명절/${sido}] API 오류: ${JSON.stringify(header)}`); return rows }
              const body = json.response.body
              totalCount = Number(body.totalCount || 0)
              let items = body.items?.item || []
              if (!Array.isArray(items)) items = items ? [items] : []
              for (const item of items) if (item.dutyDiv === 'H') rows.push(mapHolidayItem(sido, item))
              if (items.length === 0) break
              pageNo++
              await new Promise(r => setTimeout(r, 150))
            }
            return rows
          }

          async function upsertHolidayRows(rows) {
            if (rows.length === 0) return
            for (let i = 0; i < rows.length; i += 200) {
              const chunk = rows.slice(i, i + 200)
              const res = await fetch(`${SUPABASE_URL}/rest/v1/chuseok_seollal_pharmacies?on_conflict=hpid,duty_day1`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${SUPABASE_SERVICE_ROLE_KEY}`, Prefer: 'resolution=merge-duplicates,return=minimal' },
                body: JSON.stringify(chunk),
              })
              if (!res.ok) console.log(`❌ [명절] upsert 실패 (${res.status}): ${await res.text()}`)
            }
          }

          // ============ 3) 자동 발행 판단 ============
          function dayOfWeek(dateStr) { // 'YYYY-MM-DD' -> 0=일 ~ 6=토 (TZ 무관)
            const [y, m, d] = dateStr.split('-').map(Number)
            return new Date(Date.UTC(y, m - 1, d)).getUTCDay()
          }

          function todayKST() {
            return new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10)
          }

          function tomorrowKST() {
            if (FORCE_PUBLISH_DATE) { console.log(`⚠️ 테스트 모드: 날짜를 ${FORCE_PUBLISH_DATE}로 강제 지정`); return FORCE_PUBLISH_DATE }
            const now = new Date(Date.now() + 9 * 60 * 60 * 1000)
            now.setUTCDate(now.getUTCDate() + 1)
            return now.toISOString().slice(0, 10)
          }

          async function sbSelect(table, qs) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${qs}`, {
              headers: { apikey: SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${SUPABASE_SERVICE_ROLE_KEY}` },
            })
            if (!res.ok) { console.log(`❌ [조회 실패] ${table}: ${res.status}`); return [] }
            return res.json()
          }

          function fmtHM(hhmm) {
            if (!hhmm || hhmm.length !== 4) return null
            return `${hhmm.slice(0, 2)}:${hhmm.slice(2, 4)}`
          }

          // ============ 지역 분할 발행 (서울/경기는 인구가 많아 강남·강북/북부·남부로 추가 분할, 총 19개 지역) ============
          const SEOUL_GANGBUK_GU = ['종로구','중구','용산구','성동구','광진구','동대문구','중랑구','성북구','강북구','도봉구','노원구','은평구','서대문구','마포구']
          const SEOUL_GANGNAM_GU = ['강남구','서초구','송파구','강동구','영등포구','동작구','관악구','금천구','구로구','양천구','강서구']
          const GYEONGGI_NORTH_SI = ['고양시','구리시','남양주시','동두천시','양주시','연천군','의정부시','파주시','포천시','가평군','김포시']

          const REGION_DEFS = [
            { key: 'seoul-gangbuk', title: '서울(강북권)', filter: r => r.sido === '서울특별시' && SEOUL_GANGBUK_GU.includes(subRegionOf(r.addr)) },
            { key: 'seoul-gangnam', title: '서울(강남권)', filter: r => r.sido === '서울특별시' && SEOUL_GANGNAM_GU.includes(subRegionOf(r.addr)) },
            { key: 'gyeonggi-north', title: '경기북부', filter: r => r.sido === '경기도' && GYEONGGI_NORTH_SI.includes(subRegionOf(r.addr)) },
            { key: 'gyeonggi-south', title: '경기남부', filter: r => r.sido === '경기도' && !GYEONGGI_NORTH_SI.includes(subRegionOf(r.addr)) },
            { key: 'busan', title: '부산광역시', filter: r => r.sido === '부산광역시' },
            { key: 'daegu', title: '대구광역시', filter: r => r.sido === '대구광역시' },
            { key: 'incheon', title: '인천광역시', filter: r => r.sido === '인천광역시' },
            { key: 'gwangju', title: '광주광역시', filter: r => r.sido === '광주광역시' },
            { key: 'daejeon', title: '대전광역시', filter: r => r.sido === '대전광역시' },
            { key: 'ulsan', title: '울산광역시', filter: r => r.sido === '울산광역시' },
            { key: 'sejong', title: '세종특별자치시', filter: r => r.sido === '세종특별자치시' },
            { key: 'gangwon', title: '강원특별자치도', filter: r => r.sido === '강원특별자치도' },
            { key: 'chungbuk', title: '충청북도', filter: r => r.sido === '충청북도' },
            { key: 'chungnam', title: '충청남도', filter: r => r.sido === '충청남도' },
            { key: 'jeonbuk', title: '전북특별자치도', filter: r => r.sido === '전북특별자치도' },
            { key: 'jeonnam', title: '전라남도', filter: r => r.sido === '전라남도' },
            { key: 'gyeongbuk', title: '경상북도', filter: r => r.sido === '경상북도' },
            { key: 'gyeongnam', title: '경상남도', filter: r => r.sido === '경상남도' },
            { key: 'jeju', title: '제주특별자치도', filter: r => r.sido === '제주특별자치도' },
          ]

          function subRegionOf(addr) {
            const parts = (addr || '').trim().split(/\s+/)
            return parts[1] || '기타'
          }

          function buildRegionTable(rows) {
            const bySub = {}
            for (const r of rows) {
              const sub = subRegionOf(r.addr)
              if (!bySub[sub]) bySub[sub] = []
              bySub[sub].push(r)
            }
            const th = (label) => `<th style="border:1px solid #ccc;padding:6px 8px;background:#f2f2f2;">${label}</th>`
            const td = (val, center) => `<td style="border:1px solid #ccc;padding:6px 8px;${center ? 'text-align:center;' : ''}">${val}</td>`
            let html = ''
            let n = 0
            for (const sub of Object.keys(bySub).sort((a, b) => a.localeCompare(b, 'ko'))) {
              const list = bySub[sub].sort((a, b) => a.name.localeCompare(b.name, 'ko'))
              html += `<h3>${sub}</h3>\n<table style="width:100%;border-collapse:collapse;margin:0 0 24px;font-size:14px;">\n`
              html += `<thead><tr>${th('번호')}${th('약국명')}${th('주소')}${th('전화')}${th('영업시간')}</tr></thead>\n<tbody>\n`
              for (const r of list) {
                n++
                html += `<tr>${td(n, true)}${td(`<strong>${r.name}</strong>`)}${td(r.addr)}${td(r.tel || '')}${td(r.timeStr || '')}</tr>\n`
              }
              html += `</tbody></table>\n`
            }
            return html
          }

          async function composeChuseokPost(targetDate) {
            const orFilter = [1, 2, 3, 4, 5].map(n => `duty_day${n}.eq.${targetDate}`).join(',')
            const rows = await sbSelect('chuseok_seollal_pharmacies', `select=*&or=(${orFilter})&order=sido,name&limit=10000`)
            const bySido = {}
            for (const r of rows) {
              let timeStr = null
              for (let n = 1; n <= 5; n++) {
                if (r[`duty_day${n}`] === targetDate) { timeStr = r[`duty_time${n}`]; break }
              }
              if (!timeStr) continue
              if (!bySido[r.sido]) bySido[r.sido] = []
              bySido[r.sido].push({ ...r, timeStr })
            }
            const dateLabel = targetDate.replace(/-/g, '.')
            const title = `${dateLabel} 명절 약국 찾기 — 설날·추석 연휴 문 여는 약국 리스트`
            let content = `<p>${dateLabel}은 명절 연휴 기간입니다. 이날 실제로 문을 여는 전국 약국 리스트입니다(국립중앙의료원 명절 비상진료기관 데이터 기반). 연휴 중 일정이 매일 달라질 수 있으니 방문 전 전화 확인을 권장드려요.</p>\n`
            for (const sido of Object.keys(bySido).sort()) {
              content += `<h2>${sido}</h2>\n<ul>\n`
              for (const r of bySido[sido]) {
                content += `<li><strong>${r.name}</strong> ${r.addr} ${r.tel || ''} — ${r.timeStr}${r.duty_etc ? ` (${r.duty_etc})` : ''}</li>\n`
              }
              content += `</ul>\n`
            }
            return { title, content }
          }

          async function decideAndPublish() {
            const targetDate = tomorrowKST()

            const chuseokMatch = await sbSelect('chuseok_seollal_pharmacies',
              `select=id&or=(${[1, 2, 3, 4, 5].map(n => `duty_day${n}.eq.${targetDate}`).join(',')})&limit=1`)

            let postType = null
            if (chuseokMatch.length > 0) postType = 'chuseok'
            else if (dayOfWeek(targetDate) === 0) postType = 'sunday'
            else if (SINGLE_DAY_HOLIDAYS_2026.includes(targetDate)) postType = 'holiday'

            if (!postType) { console.log(`ℹ️ ${targetDate}는 발행 대상 아님 (평일)`); return }

            const slug = `${postType}-pharmacy-${targetDate.replace(/-/g, '')}`

            const existing = await sbSelect('blog_posts', `select=id&slug=eq.${slug}&limit=1`)
            if (existing.length > 0) { console.log(`ℹ️ 이미 발행됨: ${slug}`); return }

            const { title, content } = postType === 'chuseok'
              ? await composeChuseokPost(targetDate)
              : await composeRegularPost(targetDate, postType)

            const res = await fetch(`${SITE_BASE}/api/blog/posts`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-admin-token': ADMIN_SECRET_TOKEN },
              body: JSON.stringify({ title, slug, content, category: '휴일약국', status: 'published', content_format: 'html' }),
            })
            if (!res.ok) console.log(`❌ 발행 실패 (${res.status}): ${await res.text()}`)
            else console.log(`✅ 발행 완료: ${title} (${slug})`)
          }

          async function main() {
            // 전체 재수집은 느려서(9~11분) 매일 안 하고 월요일에만, 또는 수동으로 강제 실행했을 때만 돈다.
            // 발행 판단은 이미 저장된 DB만 읽어서 몇 초면 끝나므로 매일(또는 강제 테스트 시) 돈다.
            const isMonday = dayOfWeek(todayKST()) === 1
            const shouldFullSync = isMonday || FORCE_FULL_SYNC === 'true'

            if (shouldFullSync) {
              console.log(`🔄 전체 재수집 실행 (${isMonday ? '월요일' : '수동 강제실행'})\n`)

              let totalSaved = 0
              for (const sido of SIDO_LIST) {
                const rows = await fetchSido(sido)
                await upsertPharmRows(rows)
                console.log(`✅ [약국] ${sido}: ${rows.length}곳`)
                totalSaved += rows.length
                await new Promise(r => setTimeout(r, 200))
              }
              console.log(`완료: 공휴일 진료 약국 총 ${totalSaved}곳 저장\n`)

              let holidayTotalSaved = 0
              for (const sido of SIDO_LIST) {
                const rows = await fetchHolidaySido(sido)
                await upsertHolidayRows(rows)
                console.log(`✅ [명절] ${sido}: ${rows.length}곳`)
                holidayTotalSaved += rows.length
                await new Promise(r => setTimeout(r, 200))
              }
              console.log(`완료: 명절 비상진료 약국 총 ${holidayTotalSaved}곳 저장\n`)
            } else {
              console.log(`⏭️ 오늘은 전체 재수집 건너뜀 (저장된 데이터로 발행 판단만 실행, 월요일에 다음 재수집 예정)\n`)
            }

            await decideAndPublish()
          }

          main().catch(e => { console.error(e); process.exit(1) })
          SCRIPT
