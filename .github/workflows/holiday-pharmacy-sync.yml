
name: 휴일지킴이약국 자동 수집 및 발행

on:
  schedule:
    - cron: '30 20 * * *'  # 매일 오전 5시 30분 KST (UTC 20:30)
  workflow_dispatch:        # 수동 실행 가능
    inputs:
      force_full_sync:
        description: '전체 재수집 강제 실행 (평소엔 월요일에만 자동 실행됨)'
        type: boolean
        default: false
      force_publish_date:
        description: '발행 판단용 날짜 강제 지정 — 테스트용 (YYYY-MM-DD, 비워두면 평소처럼 내일 날짜 자동 사용)'
        type: string
        default: ''

jobs:
  sync-holiday-pharmacy:
    runs-on: ubuntu-latest

    steps:
      - name: 약국 데이터 수집 → 자동 발행 판단 → 글 발행
        env:
          HOLIDAY_PHARMACY_API_KEY: ${{ secrets.HOLIDAY_PHARMACY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_SECRET_TOKEN: ${{ secrets.ADMIN_SECRET_TOKEN }}
          FORCE_FULL_SYNC: ${{ github.event.inputs.force_full_sync }}
          FORCE_PUBLISH_DATE: ${{ github.event.inputs.force_publish_date }}
        run: |
          node << 'SCRIPT'
          const {
            HOLIDAY_PHARMACY_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ADMIN_SECRET_TOKEN,
            FORCE_FULL_SYNC, FORCE_PUBLISH_DATE,
          } = process.env

          const SITE_BASE = 'https://www.fsfood.kr'

          const SIDO_LIST = [
            '서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시',
            '세종특별자치시','경기도','강원특별자치도','충청북도','충청남도','전북특별자치도','전라남도',
            '경상북도','경상남도','제주특별자치도',
          ]
          const NUM_OF_ROWS = 500

          // 2026년 신정~성탄절 중 명절(설날/추석) 제외 단일 공휴일 + 대체공휴일과 그 명칭. 매년 1월 실제 달력과 대조해서 갱신 필요.
          const SINGLE_DAY_HOLIDAY_NAMES = {
            '2026-01-01': '신정',
            '2026-03-01': '삼일절',
            '2026-03-02': '삼일절 대체공휴일',
            '2026-05-05': '어린이날',
            '2026-05-24': '부처님오신날',
            '2026-05-25': '부처님오신날 대체공휴일',
            '2026-06-06': '현충일',
            '2026-08-15': '광복절',
            '2026-08-17': '광복절 대체공휴일',
            '2026-10-03': '개천절',
            '2026-10-05': '개천절 대체공휴일',
            '2026-10-09': '한글날',
            '2026-12-25': '성탄절',
          }
          const SINGLE_DAY_HOLIDAYS_2026 = Object.keys(SINGLE_DAY_HOLIDAY_NAMES)

          function fmtTime(v) {
            if (v === undefined || v === null || v === '') return null
            return String(v).padStart(4, '0')
          }

          // ============ 1) 일반 공휴일 약국 (dutyTime8) ============
          const PHARM_API_BASE = 'https://apis.data.go.kr/B552657/ErmctInsttInfoInqireService/getParmacyListInfoInqire'

          function mapPharmItem(sido, item) {
            const hpid = item.hpid || `${sido}|${item.dutyName}|${item.dutyAddr}`
            return {
              hpid, name: item.dutyName || '', sido, addr: item.dutyAddr || '', tel: item.dutyTel1 || '',
              lat: item.wgs84Lat ? Number(item.wgs84Lat) : null,
              lng: item.wgs84Lon ? Number(item.wgs84Lon) : null,
              duty_time1_s: fmtTime(item.dutyTime1s), duty_time1_c: fmtTime(item.dutyTime1c),
              duty_time2_s: fmtTime(item.dutyTime2s), duty_time2_c: fmtTime(item.dutyTime2c),
              duty_time3_s: fmtTime(item.dutyTime3s), duty_time3_c: fmtTime(item.dutyTime3c),
              duty_time4_s: fmtTime(item.dutyTime4s), duty_time4_c: fmtTime(item.dutyTime4c),
              duty_time5_s: fmtTime(item.dutyTime5s), duty_time5_c: fmtTime(item.dutyTime5c),
              duty_time6_s: fmtTime(item.dutyTime6s), duty_time6_c: fmtTime(item.dutyTime6c),
              duty_time7_s: fmtTime(item.dutyTime7s), duty_time7_c: fmtTime(item.dutyTime7c),
              duty_time8_s: fmtTime(item.dutyTime8s), duty_time8_c: fmtTime(item.dutyTime8c),
              fetched_at: new Date().toISOString(),
            }
          }

          async function fetchSido(sido) {
            let pageNo = 1, totalCount = Infinity
            const rows = []
            while ((pageNo - 1) * NUM_OF_ROWS < totalCount) {
              const url = `${PHARM_API_BASE}?serviceKey=${HOLIDAY_PHARMACY_API_KEY}&Q0=${encodeURIComponent(sido)}&pageNo=${pageNo}&numOfRows=${NUM_OF_ROWS}&_type=json`
              const res = await fetch(url)
              const text = await res.text()
              let json
              try { json = JSON.parse(text) } catch { console.log(`❌ [약국/${sido}] JSON 파싱 실패: ${text.slice(0, 300)}`); return rows }
              const header = json?.response?.header
              if (!header || header.resultCode !== '00') { console.log(`❌ [약국/${sido}] API 오류: ${JSON.stringify(header)}`); return rows }
              const body = json.response.body
              totalCount = Number(body.totalCount || 0)
              let items = body.items?.item || []
              if (!Array.isArray(items)) items = items ? [items] : []
              for (const item of items) if (item.dutyTime7s || item.dutyTime7c || item.dutyTime8s || item.dutyTime8c) rows.push(mapPharmItem(sido, item))
              if (items.length === 0) break
              pageNo++
              await new Promise(r => setTimeout(r, 150))
            }
            return rows
          }

          async function upsertPharmRows(rows) {
            if (rows.length === 0) return
            for (let i = 0; i < rows.length; i += 200) {
              const chunk = rows.slice(i, i + 200)
              const res = await fetch(`${SUPABASE_URL}/rest/v1/holiday_pharmacies?on_conflict=hpid`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${SUPABASE_SERVICE_ROLE_KEY}`, Prefer: 'resolution=merge-duplicates,return=minimal' },
                body: JSON.stringify(chunk),
              })
              if (!res.ok) console.log(`❌ [약국] upsert 실패 (${res.status}): ${await res.text()}`)
            }
          }

          // ============ 2) 명절(설날/추석) 비상진료 약국 ============
          const HOLIDAY_API_BASE = 'https://apis.data.go.kr/B552657/HolidyEmgncClnicInsttInfoInqireService/getHolidyClnicPosblEgytInfoInqire'

          function mapHolidayItem(sido, item) {
            const hpid = item.hpid || `${sido}|${item.dutyName}|${item.dutyAddr}`
            return {
              hpid, name: item.dutyName || '', sido, addr: item.dutyAddr || '', tel: item.dutyTel1 || '',
              duty_day1: item.dutyDay1 || null, duty_time1: item.dutyDaytime1 || null,
              duty_day2: item.dutyDay2 || null, duty_time2: item.dutyDaytime2 || null,
              duty_day3: item.dutyDay3 || null, duty_time3: item.dutyDaytime3 || null,
              duty_day4: item.dutyDay4 || null, duty_time4: item.dutyDaytime4 || null,
              duty_day5: item.dutyDay5 || null, duty_time5: item.dutyDaytime5 || null,
              duty_etc: item.dutyDayetc || null,
              fetched_at: new Date().toISOString(),
            }
          }

          async function fetchHolidaySido(sido) {
            let pageNo = 1, totalCount = Infinity
            const rows = []
            while ((pageNo - 1) * NUM_OF_ROWS < totalCount) {
              const url = `${HOLIDAY_API_BASE}?serviceKey=${HOLIDAY_PHARMACY_API_KEY}&Q0=${encodeURIComponent(sido)}&pageNo=${pageNo}&numOfRows=${NUM_OF_ROWS}&_type=json`
              const res = await fetch(url)
              const text = await res.text()
              let json
              try { json = JSON.parse(text) } catch { console.log(`❌ [명절/${sido}] JSON 파싱 실패: ${text.slice(0, 300)}`); return rows }
              const header = json?.response?.header
              if (!header || header.resultCode !== '00') { console.log(`❌ [명절/${sido}] API 오류: ${JSON.stringify(header)}`); return rows }
              const body = json.response.body
              totalCount = Number(body.totalCount || 0)
              let items = body.items?.item || []
              if (!Array.isArray(items)) items = items ? [items] : []
              for (const item of items) if (item.dutyDiv === 'H') rows.push(mapHolidayItem(sido, item))
              if (items.length === 0) break
              pageNo++
              await new Promise(r => setTimeout(r, 150))
            }
            return rows
          }

          async function upsertHolidayRows(rows) {
            if (rows.length === 0) return
            for (let i = 0; i < rows.length; i += 200) {
              const chunk = rows.slice(i, i + 200)
              const res = await fetch(`${SUPABASE_URL}/rest/v1/chuseok_seollal_pharmacies?on_conflict=hpid,duty_day1`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${SUPABASE_SERVICE_ROLE_KEY}`, Prefer: 'resolution=merge-duplicates,return=minimal' },
                body: JSON.stringify(chunk),
              })
              if (!res.ok) console.log(`❌ [명절] upsert 실패 (${res.status}): ${await res.text()}`)
            }
          }

          // ============ 3) 자동 발행 판단 ============
          function dayOfWeek(dateStr) { // 'YYYY-MM-DD' -> 0=일 ~ 6=토 (TZ 무관)
            const [y, m, d] = dateStr.split('-').map(Number)
            return new Date(Date.UTC(y, m - 1, d)).getUTCDay()
          }

          function todayKST() {
            return new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10)
          }

          function tomorrowKST() {
            if (FORCE_PUBLISH_DATE) { console.log(`⚠️ 테스트 모드: 날짜를 ${FORCE_PUBLISH_DATE}로 강제 지정`); return FORCE_PUBLISH_DATE }
            const now = new Date(Date.now() + 9 * 60 * 60 * 1000)
            now.setUTCDate(now.getUTCDate() + 1)
            return now.toISOString().slice(0, 10)
          }

          async function sbSelect(table, qs) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${qs}`, {
              headers: { apikey: SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${SUPABASE_SERVICE_ROLE_KEY}` },
            })
            if (!res.ok) { console.log(`❌ [조회 실패] ${table}: ${res.status}`); return [] }
            return res.json()
          }

          // Supabase(PostgREST)는 쿼리에 limit=10000을 줘도 프로젝트 기본 db-max-rows(보통 1000)를
          // 넘겨서 못 돌려줌 — 전체를 다 가져오려면 offset을 옮겨가며 페이지네이션해야 함.
          async function sbSelectAll(table, qs, pageSize = 1000) {
            let all = []
            let offset = 0
            while (true) {
              const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${qs}&limit=${pageSize}&offset=${offset}`, {
                headers: { apikey: SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${SUPABASE_SERVICE_ROLE_KEY}` },
              })
              if (!res.ok) { console.log(`❌ [조회 실패] ${table}: ${res.status}`); break }
              const page = await res.json()
              all = all.concat(page)
              if (page.length < pageSize) break
              offset += pageSize
            }
            return all
          }

          function fmtHM(hhmm) {
            if (!hhmm || hhmm.length !== 4) return null
            return `${hhmm.slice(0, 2)}:${hhmm.slice(2, 4)}`
          }

          const WEEKDAY_KO = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일']
          function weekdayLabel(dateStr) { return WEEKDAY_KO[dayOfWeek(dateStr)] }

          // 설날은 1~2월, 추석은 9~10월(양력 기준)에만 온다는 규칙을 이용한 단순 판별 — 실제 명절 여부/구간 자체는
          // chuseok_seollal_pharmacies 테이블 매칭으로 이미 확정된 뒤, 이름표만 붙이는 용도.
          function chuseokSeasonLabel(dateStr) {
            const month = Number(dateStr.split('-')[1])
            if (month === 1 || month === 2) return '설날 연휴'
            if (month === 9 || month === 10) return '추석 연휴'
            return '명절 연휴'
          }

          // 제목/부제에 공통으로 쓰는 라벨: 요일 + (해당하면) 구체적인 공휴일·명절 이름
          function kindLabelFor(targetDate, postType) {
            const weekday = weekdayLabel(targetDate)
            if (postType === 'sunday') return weekday
            if (postType === 'holiday') return `${weekday} ${SINGLE_DAY_HOLIDAY_NAMES[targetDate] || '공휴일'}`
            return `${weekday} ${chuseokSeasonLabel(targetDate)}`
          }

          // 주소 문자열에서 시도명을 뗀 다음 그 다음 토큰(시/군/구)을 지역명으로 추출.
          // 예: "경기도 남양주시 화도읍 ..." + sido="경기도" -> "남양주시"
          function extractDistrict(addr, sido) {
            if (!addr) return ''
            const rest = addr.startsWith(sido) ? addr.slice(sido.length).trim() : addr.trim()
            return rest.split(/\s+/)[0] || ''
          }

          const SEOUL_GANGNAM_GU = ['강남구', '서초구', '송파구', '강동구', '영등포구', '동작구', '관악구', '금천구', '구로구', '양천구', '강서구']
          const SEOUL_GANGBUK_GU = ['종로구', '중구', '용산구', '성동구', '광진구', '동대문구', '중랑구', '성북구', '강북구', '도봉구', '노원구', '은평구', '서대문구', '마포구']
          const GYEONGGI_NORTH_SI = ['고양시', '구리시', '남양주시', '동두천시', '양주시', '연천군', '의정부시', '파주시', '포천시', '가평군', '김포시']
          const GYEONGGI_SOUTH_SI = ['수원시', '성남시', '용인시', '부천시', '안산시', '안양시', '평택시', '시흥시', '화성시', '광명시', '군포시', '이천시', '오산시', '하남시', '의왕시', '여주시', '광주시', '안성시', '과천시', '양평군']

          // 서울/경기를 뺀 나머지 15개 시도 (슬러그용 영문 키)
          const OTHER_SIDO_KEY = {
            '부산광역시': 'busan', '대구광역시': 'daegu', '인천광역시': 'incheon', '광주광역시': 'gwangju',
            '대전광역시': 'daejeon', '울산광역시': 'ulsan', '세종특별자치시': 'sejong', '강원특별자치도': 'gangwon',
            '충청북도': 'chungbuk', '충청남도': 'chungnam', '전북특별자치도': 'jeonbuk', '전라남도': 'jeonnam',
            '경상북도': 'gyeongbuk', '경상남도': 'gyeongnam', '제주특별자치도': 'jeju',
          }

          // 서울 강남/강북 + 경기 북부/남부 + 나머지 15개 시도 = 총 19개 발행 지역
          const REGION_GROUPS = [
            { key: 'seoul-gangnam', label: '서울 강남권', filter: r => r.sido === '서울특별시' && SEOUL_GANGNAM_GU.includes(extractDistrict(r.addr, r.sido)) },
            { key: 'seoul-gangbuk', label: '서울 강북권', filter: r => r.sido === '서울특별시' && SEOUL_GANGBUK_GU.includes(extractDistrict(r.addr, r.sido)) },
            { key: 'gyeonggi-north', label: '경기 북부', filter: r => r.sido === '경기도' && GYEONGGI_NORTH_SI.includes(extractDistrict(r.addr, r.sido)) },
            { key: 'gyeonggi-south', label: '경기 남부', filter: r => r.sido === '경기도' && GYEONGGI_SOUTH_SI.includes(extractDistrict(r.addr, r.sido)) },
            ...Object.entries(OTHER_SIDO_KEY).map(([sido, key]) => ({ key, label: sido, filter: r => r.sido === sido })),
          ]

          function buildTable(rows) {
            let html = `<table style="width:100%;border-collapse:collapse;">\n<thead>\n<tr>` +
              `<th style="border:1px solid #ccc;padding:6px 8px;background:#f5f5f5;">번호</th>` +
              `<th style="border:1px solid #ccc;padding:6px 8px;background:#f5f5f5;">약국명</th>` +
              `<th style="border:1px solid #ccc;padding:6px 8px;background:#f5f5f5;">주소</th>` +
              `<th style="border:1px solid #ccc;padding:6px 8px;background:#f5f5f5;">전화</th>` +
              `<th style="border:1px solid #ccc;padding:6px 8px;background:#f5f5f5;">운영시간</th>` +
              `</tr>\n</thead>\n<tbody>\n`
            rows.forEach((r, i) => {
              html += `<tr>` +
                `<td style="border:1px solid #ccc;padding:6px 8px;text-align:center;">${i + 1}</td>` +
                `<td style="border:1px solid #ccc;padding:6px 8px;"><strong>${r.name}</strong></td>` +
                `<td style="border:1px solid #ccc;padding:6px 8px;">${r.addr}</td>` +
                `<td style="border:1px solid #ccc;padding:6px 8px;">${r.tel || ''}</td>` +
                `<td style="border:1px solid #ccc;padding:6px 8px;">${r.timeStr || ''}</td>` +
                `</tr>\n`
            })
            html += `</tbody>\n</table>\n`
            return html
          }

          // district(구/시)별로 <h2> 소제목을 붙이고 그 구/시 안에서만 번호를 다시 매긴 표를 이어붙임.
          // 소제목도 제목과 같은 방식(날짜+요일/공휴일명+지역+오늘)으로 구성.
          // rows는 이미 district, name 순으로 정렬돼 있어야 함(같은 district가 뭉쳐 있어야 grouping이 맞음).
          function buildDistrictSections(rows, dateLabel, kindLabel) {
            let html = ''
            let currentDistrict = null
            let bucket = []
            const flush = () => {
              if (bucket.length === 0) return
              html += `<h2>${dateLabel} ${kindLabel} ${currentDistrict} 오늘 문여는 약국</h2>\n`
              html += buildTable(bucket)
              bucket = []
            }
            for (const r of rows) {
              if (r.district !== currentDistrict) { flush(); currentDistrict = r.district }
              bucket.push(r)
            }
            flush()
            return html
          }

          // 정기(매주 일요일 / 지정 공휴일) 발행 — 서울강남/강북·경기북부/남부·나머지 15개 시도 = 19개 글로 분리
          async function composeRegionalPosts(targetDate, kind) {
            // 일요일(매주 반복)은 duty_time7, 실제 지정 공휴일(신정·삼일절 등)은 duty_time8 — 서로 다른 필드라 구분해서 읽어야 함
            const fieldIdx = kind === 'sunday' ? 7 : 8
            const sField = `duty_time${fieldIdx}_s`, cField = `duty_time${fieldIdx}_c`
            const allRows = await sbSelectAll('holiday_pharmacies', `select=name,sido,addr,tel,${sField},${cField}&order=sido,name`)

            const usable = allRows
              .filter(r => r[sField] || r[cField]) // 이 날짜 종류에 해당하는 시간이 없는 약국은 제외
              .map(r => ({
                name: r.name, sido: r.sido, addr: r.addr, tel: r.tel,
                district: extractDistrict(r.addr, r.sido),
                timeStr: fmtHM(r[sField]) && fmtHM(r[cField]) ? `${fmtHM(r[sField])}~${fmtHM(r[cField])}` : '',
              }))

            const dateLabel = targetDate.replace(/-/g, '.')
            const kindLabel = kindLabelFor(targetDate, kind)

            const posts = []
            for (const group of REGION_GROUPS) {
              const rows = usable.filter(group.filter).sort((a, b) => {
                const d = a.district.localeCompare(b.district, 'ko')
                if (d !== 0) return d
                return a.name.localeCompare(b.name, 'ko')
              })
              if (rows.length === 0) { console.log(`⏭️ [${group.label}] 대상 약국 없음, 건너뜀`); continue }

              const title = `${dateLabel} ${kindLabel} 약국 찾기 — ${group.label} 오늘 문 여는 약국 리스트`
              const summary = `${dateLabel}(${kindLabel}) ${group.label}에서 오늘 문 여는 약국을 구/시별 가나다순으로 정리했습니다. 방문 전 전화 확인 권장.`
              const content =
                `<p>${dateLabel}(${kindLabel}) ${group.label} 지역에서 오늘 문을 여는 약국 리스트입니다. ` +
                `국립중앙의료원 공공데이터 기반으로 자동 갱신됩니다. 약국명은 구/시 안에서 가나다순으로 정렬되어 있습니다. ` +
                `실제 방문 전 전화로 한 번 더 확인하시는 걸 권장드려요.</p>\n` +
                buildDistrictSections(rows, dateLabel, kindLabel)

              posts.push({ key: group.key, label: group.label, title, summary, content })
            }
            return posts
          }

          // 명절(설날/추석) 발행 — 정기 발행과 동일하게 19개 지역 글로 분리
          async function composeChuseokPosts(targetDate) {
            const orFilter = [1, 2, 3, 4, 5].map(n => `duty_day${n}.eq.${targetDate}`).join(',')
            const rows = await sbSelectAll('chuseok_seollal_pharmacies', `select=*&or=(${orFilter})&order=sido,name`)

            const usable = []
            for (const r of rows) {
              let timeStr = null
              for (let n = 1; n <= 5; n++) {
                if (r[`duty_day${n}`] === targetDate) { timeStr = r[`duty_time${n}`]; break }
              }
              if (!timeStr) continue
              usable.push({
                name: r.name, sido: r.sido, addr: r.addr, tel: r.tel,
                district: extractDistrict(r.addr, r.sido),
                timeStr: r.duty_etc ? `${timeStr} (${r.duty_etc})` : timeStr,
              })
            }

            const dateLabel = targetDate.replace(/-/g, '.')
            const kindLabel = kindLabelFor(targetDate, 'chuseok')

            const posts = []
            for (const group of REGION_GROUPS) {
              const groupRows = usable.filter(group.filter).sort((a, b) => {
                const d = a.district.localeCompare(b.district, 'ko')
                if (d !== 0) return d
                return a.name.localeCompare(b.name, 'ko')
              })
              if (groupRows.length === 0) { console.log(`⏭️ [${group.label}] 명절 대상 약국 없음, 건너뜀`); continue }

              const title = `${dateLabel} ${kindLabel} 약국 찾기 — ${group.label} 오늘 문 여는 약국 리스트`
              const summary = `${dateLabel}(${kindLabel}) ${group.label}에서 오늘 문 여는 약국을 구/시별 가나다순으로 정리했습니다. 연휴 중 일정이 바뀔 수 있으니 방문 전 전화 확인 권장.`
              const content =
                `<p>${dateLabel}(${kindLabel}) 기간입니다. ${group.label} 지역에서 오늘 실제로 문을 여는 약국 리스트입니다(국립중앙의료원 명절 비상진료기관 데이터 기반). ` +
                `약국명은 구/시 안에서 가나다순으로 정렬되어 있습니다. 연휴 중 일정이 매일 달라질 수 있으니 방문 전 전화 확인을 권장드려요.</p>\n` +
                buildDistrictSections(groupRows, dateLabel, kindLabel)

              posts.push({ key: group.key, label: group.label, title, summary, content })
            }
            return posts
          }

          async function publishPost({ title, slug, summary, content }) {
            const existing = await sbSelect('blog_posts', `select=id&slug=eq.${slug}&limit=1`)
            if (existing.length > 0) { console.log(`ℹ️ 이미 발행됨: ${slug}`); return }

            const res = await fetch(`${SITE_BASE}/api/blog/posts`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-admin-token': ADMIN_SECRET_TOKEN },
              body: JSON.stringify({ title, slug, summary, content, category: '휴일약국', status: 'published', content_format: 'html' }),
            })
            if (!res.ok) console.log(`❌ 발행 실패 (${res.status}) [${slug}]: ${await res.text()}`)
            else console.log(`✅ 발행 완료: ${title} (${slug})`)
          }

          async function decideAndPublish() {
            const targetDate = tomorrowKST()

            const chuseokMatch = await sbSelect('chuseok_seollal_pharmacies',
              `select=id&or=(${[1, 2, 3, 4, 5].map(n => `duty_day${n}.eq.${targetDate}`).join(',')})&limit=1`)

            let postType = null
            if (chuseokMatch.length > 0) postType = 'chuseok'
            else if (dayOfWeek(targetDate) === 0) postType = 'sunday'
            else if (SINGLE_DAY_HOLIDAYS_2026.includes(targetDate)) postType = 'holiday'

            if (!postType) { console.log(`ℹ️ ${targetDate}는 발행 대상 아님 (평일)`); return }

            const dateStamp = targetDate.replace(/-/g, '')

            // chuseok / sunday / holiday 전부 동일하게 19개 지역 글로 분리 발행
            const posts = postType === 'chuseok'
              ? await composeChuseokPosts(targetDate)
              : await composeRegionalPosts(targetDate, postType)

            for (const p of posts) {
              const slug = `${postType}-pharmacy-${p.key}-${dateStamp}`
              await publishPost({ title: p.title, slug, summary: p.summary, content: p.content })
              await new Promise(r => setTimeout(r, 300))
            }
          }

          async function main() {
            // 전체 재수집은 느려서(9~11분) 매일 안 하고 월요일에만, 또는 수동으로 강제 실행했을 때만 돈다.
            // 발행 판단은 이미 저장된 DB만 읽어서 몇 초면 끝나므로 매일(또는 강제 테스트 시) 돈다.
            const isMonday = dayOfWeek(todayKST()) === 1
            const shouldFullSync = isMonday || FORCE_FULL_SYNC === 'true'

            if (shouldFullSync) {
              console.log(`🔄 전체 재수집 실행 (${isMonday ? '월요일' : '수동 강제실행'})\n`)

              let totalSaved = 0
              for (const sido of SIDO_LIST) {
                const rows = await fetchSido(sido)
                await upsertPharmRows(rows)
                console.log(`✅ [약국] ${sido}: ${rows.length}곳`)
                totalSaved += rows.length
                await new Promise(r => setTimeout(r, 200))
              }
              console.log(`완료: 공휴일 진료 약국 총 ${totalSaved}곳 저장\n`)

              let holidayTotalSaved = 0
              for (const sido of SIDO_LIST) {
                const rows = await fetchHolidaySido(sido)
                await upsertHolidayRows(rows)
                console.log(`✅ [명절] ${sido}: ${rows.length}곳`)
                holidayTotalSaved += rows.length
                await new Promise(r => setTimeout(r, 200))
              }
              console.log(`완료: 명절 비상진료 약국 총 ${holidayTotalSaved}곳 저장\n`)
            } else {
              console.log(`⏭️ 오늘은 전체 재수집 건너뜀 (저장된 데이터로 발행 판단만 실행, 월요일에 다음 재수집 예정)\n`)
            }

            await decideAndPublish()
          }

          main().catch(e => { console.error(e); process.exit(1) })
          SCRIPT
